name: ci
# Kernel-boundary tests need macOS Seatbelt and the pinned Node runtime. Tests that need the
# operator's agent binaries (OpenCode, Kimi, Zcode.app, AutoClaw.app, packet-ask) are not run here;
# they run on an operator machine via `agentbelt verify-updates`.
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          /usr/bin/python3 -m compileall -q .
          for f in *.mjs *.cjs; do node --check "$f"; done
          sh -n install.sh
      - name: Task policy and registry tests (synthetic, no ES entitlement)
        run: /usr/bin/python3 -I -m unittest discover -s tests -p 'test_task_*.py' -v
      - name: Native guard package tests (host only, no ES entitlement)
        run: swift test --package-path native/guard/GuardKit
      - name: R3 probe harness and signed-build checker (baseline, no ES)
        run: |
          swift test --package-path native/guard/R3Probes
          /usr/bin/python3 -I -m unittest discover -s native/guard/scripts -p 'test_*.py'
      - name: Install into the runner account
        run: ./install.sh
      - name: Initialize state (no agents installed on the runner)
        run: |
          "$HOME/.local/bin/agentbelt" init
          "$HOME/.local/bin/agentbelt" doctor || true   # exit 2 is expected: no agent is installed
      - name: Kernel boundary tests (self-contained modules)
        working-directory: /Users/runner/.local/share/agentbelt
        run: |
          /usr/bin/python3 -m unittest -v \
            tests.test_boundaries tests.test_terminal_boundary tests.test_terminal_proxy \
            tests.test_kimi_binary_privacy tests.test_hardening_fixes \
            tests.test_zcode_hook tests.test_orca_bridge tests.test_prompt_telemetry \
            tests.test_history_restore tests.test_usage_cli tests.test_swift_toolchain \
            tests.test_temp_and_scoped_rules tests.test_bootstrap \
            tests.test_security_regressions tests.test_packet_queue tests.test_gemini_review \
            tests.test_packet_promote_concurrency tests.test_installation_paths \
            tests.test_gui_privacy tests.test_privacy_boundaries tests.test_review_scope \
            tests.test_riskgate_audit tests.test_packet_privacy tests.test_profile_domains \
            tests.test_packet_relay.RequestValidationTests tests.test_packet_relay.ProviderTests \
            tests.test_packet_relay.ChannelTests tests.test_packet_promote tests.test_keychain_cancellation \
            tests.test_shot_queue tests.test_shot_watcher tests.test_git_lock tests.test_git_audit
